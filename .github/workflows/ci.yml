name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo lint
      - run: cargo test --lib
      - run: cargo wasm
      - run: cargo build --release --bin board-tui
      - name: Install zellij
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/zellij-org/zellij/releases/download/v0.45.0/zellij-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: ZAB_E2E_ZELLIJ_REQUIRED=1 ./scripts/e2e-zellij.sh
