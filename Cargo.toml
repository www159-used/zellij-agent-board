[package]
name = "zellij-agent-board"
version = "0.5.2"
edition = "2021"
description = "Floating dashboard of running coding agents for Zellij"
license = "AGPL-3.0-only"

[dependencies]
ratatui = { version = "0.30.2", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
zellij-tile = { version = "0.44", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = "0.28"
fs2 = "0.4"
serde_json = "1"

[features]
default = []
plugin = ["dep:zellij-tile"]

[lib]
name = "zellij_agent_board"
path = "src/lib.rs"

[[bin]]
name = "zellij-agent-board"
path = "src/main.rs"
required-features = ["plugin"]
test = false
doctest = false

[[bin]]
name = "board-tui"
path = "src/bin/board_tui.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
