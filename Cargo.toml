[package]
name = "zellij-agent-board"
version = "0.10.0"
edition = "2021"
description = "Floating dashboard of running coding agents for Zellij"
license = "AGPL-3.0-only"

[dependencies]
log = { version = "0.4", features = ["std"] }
fluent-bundle = "0.16"
ratatui = { version = "0.30.2", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
unic-langid = "0.9"
zellij-tile = { version = "0.44", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bottom = "=0.14.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Level-triggered /dev/tty polling preserves keys arriving with SIGWINCH.
crossterm = { version = "0.28", features = ["use-dev-tty"] }
flate2 = "1"
fs2 = "0.4"
getrandom = "0.4"
portable-pty = "0.9"
serde_json = "1"
tempfile = "3"
tui-term = "0.3.4"

[features]
default = []
plugin = ["dep:zellij-tile"]

[lib]
name = "zellij_agent_board"
path = "src/lib.rs"

[[bin]]
name = "zellij-agent-board"
path = "src/main.rs"
required-features = ["plugin"]
test = false
doctest = false

[[bin]]
name = "board-tui"
path = "src/bin/board_tui.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
